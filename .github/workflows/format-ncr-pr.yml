name: One-time NCR PR formatting

on:
  push:
    branches:
      - feat/ncr-research-foundation
    paths:
      - .github/workflows/format-ncr-pr.yml

permissions:
  contents: write

jobs:
  format-once:
    if: github.repository == 'jstnphlp/prometheus-parkey' && github.ref == 'refs/heads/feat/ncr-research-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ncr-research-foundation
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format four new research files and remove this temporary workflow
        run: |
          pnpm exec prettier --write docs/ncr-hotspot-fieldwork.md docs/ncr-release-review.md scripts/ncr-research-preview.mjs scripts/ncr-research-preview.test.mjs
          rm .github/workflows/format-ncr-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ncr-hotspot-fieldwork.md docs/ncr-release-review.md scripts/ncr-research-preview.mjs scripts/ncr-research-preview.test.mjs .github/workflows/format-ncr-pr.yml
          git commit -m 'style: format NCR research review and offline preview'
          git push origin HEAD:feat/ncr-research-foundation
