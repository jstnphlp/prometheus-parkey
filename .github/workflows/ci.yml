name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ncr-*.txt
      - run: python -m pip install -r scripts/requirements-ncr-research.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:data
      - run: node scripts/check-ncr-package.mjs data/ncr-research
      - run: node scripts/ncr-quality-review.mjs data/ncr-research --check
      - run: node scripts/ncr-fieldwork.mjs data/ncr-research --check
      - run: node scripts/ncr-phase-gates.mjs data/ncr-research
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm format:check
      - run: pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: output/playwright/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Disposable runner-local PostgreSQL only; never a linked/hosted database.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db reset --local
      - run: pnpm exec supabase test db
      - name: Verify reviewer SQL and mobile contract together
        run: node --test --test-name-pattern="local database accepts JS canonical events" scripts/ncr-reviewer.test.mjs
        env:
          PARKEY_REVIEWER_LOCAL_DB: '1'
          PARKEY_REVIEWER_DB_ENGINE: docker
      - if: always()
        run: pnpm exec supabase stop --no-backup
