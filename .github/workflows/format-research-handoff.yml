name: Format research console handoff once

on:
  push:
    branches: [feat/externalize-ncr-research-route]
    paths: [.github/workflows/format-research-handoff.yml]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/externalize-ncr-research-route
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Format two migration files and remove temporary workflow
        run: |
          pnpm exec prettier --write apps/mobile/src/app/ncr-research.tsx e2e/ncr-research.spec.ts
          rm .github/workflows/format-research-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/app/ncr-research.tsx e2e/ncr-research.spec.ts .github/workflows/format-research-handoff.yml
          git commit -m 'style: format standalone NCR research handoff and browser test'
          git push origin HEAD:feat/externalize-ncr-research-route
